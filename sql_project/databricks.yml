# This is a Databricks asset bundle definition for sql_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sql_project

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  warehouse_id:
    description: The warehouse to use
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-872699940352349.9.azuredatabricks.net
    variables:
      warehouse_id: d69015951d712c6c
      catalog: dbr2_aes_dev_adap
      schema: ${workspace.current_user.short_name}

  prod:
    mode: production
    workspace:
      host: https://adb-872699940352349.9.azuredatabricks.net
      # We explicitly specify /Users/leon.smith@assetsecure.com.au to make sure we only have a single copy.
      root_path: /Users/leon.smith@assetsecure.com.au/.bundle/${bundle.name}/${bundle.target}
    variables:
      warehouse_id: d69015951d712c6c
      catalog: dbr2_aes_dev_adap
      schema: default
    permissions:
      - user_name: leon.smith@assetsecure.com.au
        level: CAN_MANAGE
    run_as:
      user_name: leon.smith@assetsecure.com.au
